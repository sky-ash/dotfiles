# =========== #
# UPON LAUNCH #
# =========== #

# HYPRLAND STARTUP SEQUENCE
exec-once = copyq --start-server
exec-once = dunst
exec-once = hypridle
exec-once = ${HOME}/.config/hypr/scripts/xdg-portal-hyprland
exec-once = /usr/lib/polkit-kde-authentication-agent-1 
exec-once = dbus-update-activation-environment --systemd --all

# AUTOSTART PROGRAMS
exec-once = waybar
exec-once = [workspace 10] mullvad-vpn
exec = hyprshade

# SET CURSOR THEME
exec-once = hyprctl setcursor Vimix-cursors 36
#env = XCURSOR_SIZE, 36
#env = XCURSOR_THEME, Vimix-cursors
#env = HYPRCURSOR_SIZE, 36
#env = HYPRCURSOR_THEME, Vimix-cursors


# ========= #
# VARIABLES #
# ========= #

# Include external configuration file for variables
#source = ~/.config/hypr/variables.conf

# "DEFAULT PROGRAMS"
$term = kitty
$files = nautilus
$browser = firefox
$code = code
$pw = bitwarden-desktop

# UTILS
$lockscreen = hyprlock
$rofi = killall rofi || rofi -show drun -theme ~/.config/rofi/rofi.conf 
$screenshot_selected_region = mkdir -p ~/Pictures/Screenshots && hyprshot -m region -o ~/Pictures/Screenshots -f "screenshot-"$(date +%Y%m%d-%H%M%S).png
$next_keyboard_layout = hyprctl switchxkblayout current next

# SCRIPTS
$next_wallpaper = ${HOME}/.config/hypr/scripts/next-wallpaper-and-colorscheme
$sync-config-folders = ${HOME}/.config/hypr/scripts/sync-config-folders


# ======== #
# MONITORS #
# ======== #

# CENTER 21:9, LEFT 16:9
monitor = HDMI-A-1, 3440x1440, 0x0, 1
monitor = HDMI-A-2, 1920x1080, -1920x0, 1


# =============================== #
# BINDS: PROGRAMS, UTILS, SCRIPTS #
# =============================== #

# LAUNCH PROGRAMS
bind = SUPER, Q, exec, $term
bind = SUPER, W, exec, $browser
bind = SUPER, E, exec, $files
bind = SUPER, C, exec, $code
bind = SUPER, B, exec, $pw

# UTILS
bind = SUPER, L, exec, $lockscreen
bind = SUPER, space, exec, $rofi
bind = CTRL, Space, exec, $screenshot_selected_region
bind = SUPER ALT, Space, exec, $next_keyboard_layout

# SCRIPTS
bind = CTRL ALT, N, exec, $next_wallpaper
bind = CTRL ALT, U, exec, $sync-config-folders


# ================= #
# BINDS: MULTIMEDIA #
# ================= #

#binde = , XF86AudioRaiseVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0 && wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05+
#binde = , XF86AudioLowerVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0 && wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05-
binde = Super_R, bracketright, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0 && wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05+     # = , XF86AudioRaiseVolume
binde = Super_R, bracketleft, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0 && wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05-      # = , XF86AudioLowerVolume
#binde = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
#bind = , XF86AudioPlay, exec, playerctl play-pause
#bind = , XF86AudioPause, exec, playerctl play-pause
#bind = , XF86AudioNext, exec, playerctl next
#bind = , XF86AudioPrev, exec, playerctl previous


# ===================================== #
# BINDS: WORKSPACES & WINDOW MANAGEMENT #
# ===================================== #

# WINDOW MANAGEMENT
bind = ALT, Space, togglefloating, 
bind = SUPER, S, killactive, 

# SWITCH FOCUSED WINDOW
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

# RESIZE WINDOW
bind = SHIFT SUPER, left, resizeactive, -60 0
bind = SHIFT SUPER, right, resizeactive, 60 0
bind = SHIFT SUPER, up, resizeactive, 0 -60
bind = SHIFT SUPER, down, resizeactive, 0 60

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# SWITCH WORKSPACE
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10
bind = SUPER ALT, up, workspace, e+1
bind = SUPER ALT, down, workspace, e-1

bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

# MOVE WINDOW TO WORKSPACE
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10


# ===== #
# INPUT #
# ===== #

input {
    kb_layout=us,de     # keyboard layouts for switching
    follow_mouse=2
    sensitivity = -1 # -1.0 - 1.0; 0 means no modification.
}


# ======= #
# GENERAL #
# ======= #

general {
    gaps_in=5
    #no_border_on_floating = false
    gaps_out=9
    border_size=7
    col.active_border= 0x05ffffff
    col.inactive_border= 0x37373737

    gaps_workspaces = 0

    resize_on_border = false
    layout = dwindle # dwindle or master

    #snap {
    #    enabled = true
    #}
}


# ========== #
# DECORATION #
# ========== #

decoration {
    rounding=0

    # OPACITY
    active_opacity=1
    inactive_opacity=1
    fullscreen_opacity=1

    # BLUR
    blur {
        enabled = true
        size = 5
        passes = 3
        new_optimizations = true
        ignore_opacity = false
        popups = true
    }

    # SHADOW
    shadow {
        enabled = true
        #ignore_window = true
        offset = 0 0
        range=17
        render_power=4
        color = 0xff000000
    }    
}


# ========== #
# ANIMATIONS #
# ========== #

animations {
    enabled = true

    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1

    animation = windows, 1, 5, overshot, slide
    animation = windowsOut, 1, 4, smoothOut, slide
    animation = windowsMove, 1, 4, default
    animation = border, 1, 10, default
    animation = fade, 1, 10, smoothIn
    animation = fadeDim, 1, 10, smoothIn
    animation = workspaces, 1, 6, default
}


# ======= #
# LAYOUTS #
# ======= #

# https://wiki.hyprland.org/Configuring/Dwindle-Layout/ 
dwindle { 
    #pseudotile = true       
    preserve_split = true   # You probably want this
    smart_split = false 
}

# https://wiki.hyprland.org/Configuring/Master-Layout/ 
master { 
    new_status = master
}


# ============ #
# WINDOW RULES #
# ============ #

# SELECT FILE/FOLDER POP UPS
windowrule = float on, match:title Open File
windowrule = center on, match:title Open File
windowrule = size 800 600, match:title Open File

windowrule = float on, match:title Open Folder
windowrule = center on, match:title Open Folder
windowrule = size 800 600, match:title Open Folder

# FILE ROLLER FOR ZIP FILES ETC.
windowrule = float on, match:title File Roller
windowrule = center on, match:title File Roller
windowrule = size 800 600, match:title File Roller

# VOLUME CONTROL (PAVUCONTROL)
windowrule = float on, match:title ^(Volume Control)$
windowrule = size 800 600, match:title ^(Volume Control)$
windowrule = move 75 44%, match:title ^(Volume Control)$

# FIREFOX PICTURE-IN-PICTURE (POP OUT VIDEOS)
windowrule = float on, match:class ^(firefox)$, match:title ^(Picture-in-Picture)$
windowrule = center on, match:class ^(firefox)$, match:title ^(Picture-in-Picture)$
windowrule = size 1280 720, match:class ^(firefox)$, match:title ^(Picture-in-Picture)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppress_event maximize, match:class ^(.*)$


# =========== #
# LAYER RULES #
# =========== #

layerrule = animation slide, match:namespace rofi
#layerrule = blur on, match:namespace waybar
#layerrule = ignorezero, match:namespace waybar
#layerrule = ignorealpha 0.5, match:namespace waybar


# ================ #
# MISC & ECOSYSTEM #
# ================ #

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    #mouse_move_enables_dpms = true
    #key_press_enables_dpms = true
    #animate_manual_resizes = true
}

ecosystem {
    no_update_news = true
}